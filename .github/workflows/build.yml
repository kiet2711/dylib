name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile EasyComixGemini.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Building with iOS SDK at: $SDK_PATH"
          
          clang -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -install_name @rpath/EasyComixGemini.dylib \
            EasyComixGemini.m \
            -o EasyComixGemini.dylib
          
          echo "Build successful!"
          ls -lh EasyComixGemini.dylib
          file EasyComixGemini.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyComixGemini-dylib
          path: EasyComixGemini.dylib
