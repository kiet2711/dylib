name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile EasyComixGemini.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Building with iOS SDK at: $SDK_PATH"
          
          set -o pipefail
          clang -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Security \
            -install_name @rpath/EasyComixGemini.dylib \
            EasyComixGemini.m \
            -o EasyComixGemini.dylib 2>&1 | tee compile_output.txt
          
          echo "Build successful!"
          ls -lh EasyComixGemini.dylib
          file EasyComixGemini.dylib

      - name: Push Error Log to branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp compile_output.txt last_build_error.txt
          git add last_build_error.txt
          git commit -m "ci: save build error"
          git push -f origin build-log

      - name: Upload Dylib Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EasyComixGemini-dylib
          path: EasyComixGemini.dylib
